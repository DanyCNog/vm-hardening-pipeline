---
- name: "6.1.1 | Instalar AIDE"
  ansible.builtin.dnf:
    name: aide
    state: present

- name: "6.1.3 | Proteger as ferramentas de auditoria com AIDE"
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^/usr/sbin/{{ item }}\s'
    line: "/usr/sbin/{{ item }} p+i+n+u+g+s+b+acl+xattrs+sha512"
  loop: [auditctl, auditd, ausearch, aureport, autrace, augenrules]

- name: "6.1.2 | Verificação diária de integridade (cron)"
  ansible.builtin.lineinfile:
    path: /etc/crontab
    regexp: 'aide --check'
    line: "05 4 * * * root /usr/sbin/aide --check"

- name: "6.1.1 | Criar a base de dados inicial (demora alguns minutos)"
  ansible.builtin.shell: aide --init && mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
  args:
    creates: /var/lib/aide/aide.db.gz
  async: 2700
  poll: 30
