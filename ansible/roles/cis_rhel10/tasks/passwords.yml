---
# ---------- Qualidade e histórico de passwords ----------
- name: "5.3.1.3 | libpwquality instalado"
  ansible.builtin.dnf:
    name: libpwquality
    state: present

- name: "5.3.2.2.x | Garantir pasta pwquality.conf.d"
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "5.3.2.2.1-5.3.2.2.7 | Regras de qualidade de password"
  ansible.builtin.copy:
    dest: /etc/security/pwquality.conf.d/60-cis.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # CIS RHEL 10 v1.0.1 - gerido por Ansible
      # 5.3.2.2.1
      difok = 2
      # 5.3.2.2.2
      minlen = 14
      # 5.3.2.2.3
      minclass = 4
      # 5.3.2.2.4
      maxrepeat = 3
      # 5.3.2.2.5
      maxsequence = 3
      # 5.3.2.2.6
      dictcheck = 1
      # 5.3.2.2.7
      enforce_for_root

- name: "5.3.2.1.1 / 5.3.2.1.2 | Bloqueio após tentativas falhadas"
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^\s*#?\s*deny\s*=',        line: "deny = {{ cis_faillock_deny }}" }
    - { regexp: '^\s*#?\s*unlock_time\s*=', line: "unlock_time = {{ cis_faillock_unlock_time }}" }

- name: "5.3.2.3.1 / 5.3.2.3.2 | Histórico de passwords"
  ansible.builtin.lineinfile:
    path: /etc/security/pwhistory.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^\s*#?\s*remember\s*=',       line: "remember = {{ cis_pwhistory_remember }}" }
    - { regexp: '^\s*#?\s*enforce_for_root\s*$', line: "enforce_for_root" }

# ---------- PAM via authselect ----------
- name: "5.3.1.1 | Criar perfil authselect próprio a partir de {{ cis_authselect_base }}"
  ansible.builtin.command: authselect create-profile {{ cis_authselect_profile }} -b {{ cis_authselect_base }}
  args:
    creates: "/etc/authselect/custom/{{ cis_authselect_profile }}"

- name: "5.3.1.x | Ler o perfil authselect ativo"
  ansible.builtin.command: authselect current --raw
  register: cis_authselect_current
  changed_when: false
  failed_when: false

- name: "5.3.1.1-5.3.1.5 / 5.3.2.4.1 | Ativar perfil com faillock, pwhistory e sem nullok"
  ansible.builtin.command: >-
    authselect select custom/{{ cis_authselect_profile }}
    {{ cis_authselect_features | join(' ') }} --force
  when: >-
    (cis_authselect_current.stdout | trim).split() | sort
    != (['custom/' ~ cis_authselect_profile] + cis_authselect_features) | sort

# ---------- Validade das passwords e contas ----------
- name: "5.4.1.x / 5.4.3.3 | Políticas em /etc/login.defs"
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^\s*#?\s*PASS_MAX_DAYS\s', line: "PASS_MAX_DAYS\t365" }
    - { regexp: '^\s*#?\s*PASS_MIN_DAYS\s', line: "PASS_MIN_DAYS\t1" }
    - { regexp: '^\s*#?\s*PASS_WARN_AGE\s', line: "PASS_WARN_AGE\t7" }
    - { regexp: '^\s*#?\s*UMASK\s',         line: "UMASK\t\t027" }

- name: "5.4.1.5 | Novas contas bloqueadas 45 dias após a password expirar"
  ansible.builtin.lineinfile:
    path: /etc/default/useradd
    regexp: '^\s*#?\s*INACTIVE='
    line: "INACTIVE=45"

- name: "5.4.1.x | Ler validade atual das passwords"
  ansible.builtin.getent:
    database: shadow
    key: "{{ item }}"
  loop: "{{ cis_ssh_allowed_users }}"
  register: cis_shadow

- name: "5.4.1.1-5.4.1.5 | Aplicar validade e bloqueio por inatividade às contas existentes"
  ansible.builtin.command: chage --mindays 1 --maxdays 365 --warndays 7 --inactive 45 {{ item.item }}
  loop: "{{ cis_shadow.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.ansible_facts.getent_shadow[item.item][2:6] != ['1', '365', '7', '45']

- name: "5.4.3.2 | Terminar sessões inativas após 15 minutos"
  ansible.builtin.copy:
    dest: /etc/profile.d/60-cis-tmout.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # CIS 5.4.3.2 - gerido por Ansible
      typeset -xr TMOUT=900

- name: "5.4.3.3 | Umask restritiva em /etc/profile.d"
  ansible.builtin.copy:
    dest: /etc/profile.d/60-cis-umask.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # CIS 5.4.3.3 - gerido por Ansible
      umask 027

- name: "5.4.3.3 | Umask restritiva em /etc/bashrc"
  ansible.builtin.replace:
    path: /etc/bashrc
    regexp: '^(\s*)umask\s+\d+\s*$'
    replace: '\1umask 027'
