---
- name: "5.1.4 | Criar grupo de utilizadores autorizados a SSH"
  ansible.builtin.group:
    name: "{{ cis_ssh_group }}"
    state: present

- name: "5.1.4 | Adicionar utilizadores autorizados ao grupo (ANTES de restringir)"
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ cis_ssh_group }}"
    append: true
  loop: "{{ cis_ssh_allowed_users }}"

- name: "5.1.4-5.1.22 | Configuração SSH endurecida (00- é lido antes de qualquer outro drop-in)"
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-cis-hardening.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      # CIS RHEL 10 v1.0.1 - secção 5.1 - gerido por Ansible
      # Ciphers, MACs e KexAlgorithms: política criptográfica (1.6.x, 5.1.6, 5.1.15)
      # 5.1.4
      AllowGroups {{ cis_ssh_group }}
      # 5.1.5
      Banner /etc/issue.net
      # 5.1.7
      ClientAliveInterval 300
      ClientAliveCountMax 1
      # 5.1.10
      HostbasedAuthentication no
      # 5.1.11
      IgnoreRhosts yes
      # 5.1.13
      LoginGraceTime 60
      # 5.1.14
      LogLevel VERBOSE
      # 5.1.16
      MaxAuthTries 4
      # 5.1.17
      MaxStartups 10:30:60
      # 5.1.18
      MaxSessions 10
      # 5.1.19
      PermitEmptyPasswords no
      # 5.1.20
      PermitRootLogin no
      # 5.1.21
      PermitUserEnvironment no
      # 5.1.22
      UsePAM yes
  notify: reload sshd

- name: "5.1.1 | Permissões do sshd_config"
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"

- name: "Validar a configuração SSH completa ANTES de recarregar (anti-bloqueio)"
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
