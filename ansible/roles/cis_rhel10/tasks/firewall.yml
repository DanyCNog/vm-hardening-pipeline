---
- name: "4.1.1 | firewalld instalado"
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: "4.1.3 | firewalld ativo no arranque"
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: "4.1.x | SSH permitido na zona por omissão (anti-bloqueio)"
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    immediate: true
    state: enabled

- name: "4.1.5 | Tráfego de loopback na zona trusted"
  ansible.posix.firewalld:
    zone: trusted
    interface: lo
    permanent: true
    immediate: true
    state: enabled
