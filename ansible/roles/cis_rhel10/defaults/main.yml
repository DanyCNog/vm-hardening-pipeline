---
# ============================================================
# Role cis_rhel10 - CIS Red Hat Enterprise Linux 10 Benchmark v1.0.1
# Applied to Rocky Linux 10. Level 1 Server subset. IDs per item.
# ============================================================

cis_kernel_modules: true
cis_sysctl: true
cis_banners: true

# 1.1.1.x e 3.2.x - Módulos de kernel (ordem 3.2.x difere do Debian)
cis_disabled_modules:
  - { name: cramfs,        cis: "1.1.1.1" }
  - { name: freevxfs,      cis: "1.1.1.2" }
  - { name: hfs,           cis: "1.1.1.3" }
  - { name: hfsplus,       cis: "1.1.1.4" }
  - { name: jffs2,         cis: "1.1.1.5" }
  - { name: firewire-core, cis: "1.1.1.9" }
  - { name: usb-storage,   cis: "1.1.1.10" }
  - { name: atm,           cis: "3.2.1" }
  - { name: can,           cis: "3.2.2" }
  - { name: dccp,          cis: "3.2.3" }
  - { name: tipc,          cis: "3.2.4" }
  - { name: rds,           cis: "3.2.5" }
  - { name: sctp,          cis: "3.2.6" }

# 1.5.x e 3.3.x - Parâmetros de kernel (numeração 1.5.x difere do Debian)
cis_sysctl_file: /etc/sysctl.d/60-cis-hardening.conf
cis_sysctl_settings:
  - { key: fs.protected_hardlinks,    value: "1", cis: "1.5.2" }
  - { key: fs.protected_symlinks,     value: "1", cis: "1.5.3" }
  - { key: fs.suid_dumpable,          value: "0", cis: "1.5.4" }
  - { key: kernel.dmesg_restrict,     value: "1", cis: "1.5.5" }
  - { key: kernel.kptr_restrict,      value: "1", cis: "1.5.6" }
  - { key: kernel.yama.ptrace_scope,  value: "1", cis: "1.5.7" }
  - { key: kernel.randomize_va_space, value: "2", cis: "1.5.8" }
  - { key: net.ipv4.ip_forward,                        value: "0", cis: "3.3.1.1" }
  - { key: net.ipv4.conf.all.forwarding,               value: "0", cis: "3.3.1.2" }
  - { key: net.ipv4.conf.default.forwarding,           value: "0", cis: "3.3.1.3" }
  - { key: net.ipv4.conf.all.send_redirects,           value: "0", cis: "3.3.1.4" }
  - { key: net.ipv4.conf.default.send_redirects,       value: "0", cis: "3.3.1.5" }
  - { key: net.ipv4.icmp_ignore_bogus_error_responses, value: "1", cis: "3.3.1.6" }
  - { key: net.ipv4.icmp_echo_ignore_broadcasts,       value: "1", cis: "3.3.1.7" }
  - { key: net.ipv4.conf.all.accept_redirects,         value: "0", cis: "3.3.1.8" }
  - { key: net.ipv4.conf.default.accept_redirects,     value: "0", cis: "3.3.1.9" }
  - { key: net.ipv4.conf.all.secure_redirects,         value: "0", cis: "3.3.1.10" }
  - { key: net.ipv4.conf.default.secure_redirects,     value: "0", cis: "3.3.1.11" }
  - { key: net.ipv4.conf.all.rp_filter,                value: "1", cis: "3.3.1.12" }
  - { key: net.ipv4.conf.default.rp_filter,            value: "1", cis: "3.3.1.13" }
  - { key: net.ipv4.conf.all.accept_source_route,      value: "0", cis: "3.3.1.14" }
  - { key: net.ipv4.conf.default.accept_source_route,  value: "0", cis: "3.3.1.15" }
  - { key: net.ipv4.conf.all.log_martians,             value: "1", cis: "3.3.1.16" }
  - { key: net.ipv4.conf.default.log_martians,         value: "1", cis: "3.3.1.17" }
  - { key: net.ipv4.tcp_syncookies,                    value: "1", cis: "3.3.1.18" }
  - { key: net.ipv6.conf.all.forwarding,               value: "0", cis: "3.3.2.1" }
  - { key: net.ipv6.conf.default.forwarding,           value: "0", cis: "3.3.2.2" }
  - { key: net.ipv6.conf.all.accept_redirects,         value: "0", cis: "3.3.2.3" }
  - { key: net.ipv6.conf.default.accept_redirects,     value: "0", cis: "3.3.2.4" }
  - { key: net.ipv6.conf.all.accept_source_route,      value: "0", cis: "3.3.2.5" }
  - { key: net.ipv6.conf.default.accept_source_route,  value: "0", cis: "3.3.2.6" }
  - { key: net.ipv6.conf.all.accept_ra,                value: "0", cis: "3.3.2.7" }
  - { key: net.ipv6.conf.default.accept_ra,            value: "0", cis: "3.3.2.8" }

# 1.7.x - Banners (secção 1.6 no Debian)
cis_banner_text: |
  Authorized access only. All activity on this system may be monitored and reported.

# ============================================================
# Fase 5B
# ============================================================
cis_services: true
cis_mounts: true
cis_journald: true
cis_selinux_grub: true
cis_crypto_policy: true
cis_firewall: true
cis_ssh: true
cis_passwords: true
cis_sudo: true
cis_aide: true

# 6.2.1.4 - Um único sistema de logs (journald)
cis_journald_disable_rsyslog: true

# 1.3.1.7 / 1.3.1.8 / 2.1.x / 2.2.x - Pacotes a remover
cis_remove_packages:
  - mcstrans        # 1.3.1.7
  - setroubleshoot  # 1.3.1.8
  - autofs          # 2.1.1
  - avahi           # 2.1.2
  - kea             # 2.1.4
  - bind            # 2.1.5
  - dnsmasq         # 2.1.6
  - vsftpd          # 2.1.7
  - dovecot         # 2.1.8
  - cyrus-imapd     # 2.1.8
  - nfs-utils       # 2.1.9
  - cups            # 2.1.10
  - rpcbind         # 2.1.11
  - rsync           # 2.1.12
  - samba           # 2.1.13
  - net-snmp        # 2.1.14
  - telnet-server   # 2.1.15
  - tftp-server     # 2.1.16
  - squid           # 2.1.17
  - httpd           # 2.1.18
  - nginx           # 2.1.18
  - ftp             # 2.2.1
  - telnet          # 2.2.3
  - tftp            # 2.2.4

# 1.6.1-1.6.4 / 5.1.6 / 5.1.15 - Política criptográfica do sistema
cis_crypto_policy_name: "DEFAULT:NO-SSHCBC:NO-SSHWEAKCIPHERS:NO-SSHWEAKMACS:NO-WEAKMAC"
cis_crypto_modules:
  - { name: NO-SSHCBC,         line: "cipher@SSH = -*-CBC" }
  - { name: NO-SSHWEAKCIPHERS, line: "cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC" }
  - { name: NO-SSHWEAKMACS,    line: "mac@SSH = -HMAC-MD5* -UMAC-64* -UMAC-128* -HMAC-SHA1*" }
  - { name: NO-WEAKMAC,        line: "mac = -*-128*" }

# 5.1.x - SSH
cis_ssh_group: sshusers
cis_ssh_allowed_users:
  - "{{ ansible_user }}"

# 5.2.x - sudo (no RHEL o grupo administrativo é wheel)
cis_sudo_group: wheel
cis_sudo_admin_user: "{{ ansible_user }}"

# 5.3.x - PAM gerido por authselect
cis_authselect_profile: cis
cis_authselect_base: local
cis_authselect_features:
  - with-faillock
  - with-pwhistory
  - without-nullok
cis_faillock_deny: 5
cis_faillock_unlock_time: 900
cis_pwhistory_remember: 24
