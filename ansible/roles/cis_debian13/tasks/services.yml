---
- name: "2.1.x / 2.2.x | Remover servidores e clientes inseguros"
  ansible.builtin.apt:
    name: "{{ cis_remove_packages }}"
    state: absent
    purge: true

- name: "2.4.1.1 | Garantir cron instalado"
  ansible.builtin.apt:
    name: cron
    state: present

- name: "2.4.1.1 | Garantir cron ativo"
  ansible.builtin.systemd_service:
    name: cron
    enabled: true
    state: started

- name: "2.4.1.2 | Permissões de /etc/crontab"
  ansible.builtin.file:
    path: /etc/crontab
    owner: root
    group: root
    mode: "0600"

- name: "2.4.1.3-2.4.1.8 | Permissões das pastas cron"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - { path: /etc/cron.hourly,  cis: "2.4.1.3" }
    - { path: /etc/cron.daily,   cis: "2.4.1.4" }
    - { path: /etc/cron.weekly,  cis: "2.4.1.5" }
    - { path: /etc/cron.monthly, cis: "2.4.1.6" }
    - { path: /etc/cron.yearly,  cis: "2.4.1.7" }
    - { path: /etc/cron.d,       cis: "2.4.1.8" }
  loop_control:
    label: "{{ item.cis }} {{ item.path }}"

- name: "2.4.1.9 | Só utilizadores autorizados podem usar crontab"
  ansible.builtin.copy:
    dest: /etc/cron.allow
    content: "root\n"
    owner: root
    group: crontab
    mode: "0640"

- name: "2.4.1.9 | Remover cron.deny"
  ansible.builtin.file:
    path: /etc/cron.deny
    state: absent
