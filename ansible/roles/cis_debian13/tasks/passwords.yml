---
# ---------- Qualidade de passwords ----------
- name: "5.3.1.3 / 5.3.2.3 | Instalar pwquality (ativa o módulo PAM automaticamente)"
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present

- name: "5.3.3.2.x | Garantir pasta pwquality.conf.d"
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "5.3.3.2.1-5.3.3.2.8 | Regras de qualidade de password"
  ansible.builtin.copy:
    dest: /etc/security/pwquality.conf.d/60-cis.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # CIS Debian 13 v1.0.0 - gerido por Ansible
      # 5.3.3.2.1
      difok = 2
      # 5.3.3.2.2
      minlen = 14
      # 5.3.3.2.3
      minclass = 4
      # 5.3.3.2.4
      maxrepeat = 3
      # 5.3.3.2.5
      maxsequence = 3
      # 5.3.3.2.6
      dictcheck = 1
      # 5.3.3.2.7
      enforcing = 1
      # 5.3.3.2.8
      enforce_for_root

# ---------- Bloqueio após tentativas falhadas ----------
- name: "5.3.3.1.1 / 5.3.3.1.2 | Parâmetros do faillock"
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    create: true
    mode: "0644"
  loop:
    - { regexp: '^\s*#?\s*deny\s*=',        line: "deny = {{ cis_faillock_deny }}",               cis: "5.3.3.1.1" }
    - { regexp: '^\s*#?\s*unlock_time\s*=', line: "unlock_time = {{ cis_faillock_unlock_time }}", cis: "5.3.3.1.2" }
  loop_control:
    label: "{{ item.cis }} {{ item.line }}"

- name: "5.3.2.2 | Perfil PAM: faillock (bloqueio)"
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/faillock
    owner: root
    group: root
    mode: "0644"
    content: |
      Name: Enable pam_faillock to deny access
      Default: yes
      Priority: 0
      Auth-Type: Primary
      Auth:
          [default=die] pam_faillock.so authfail

- name: "5.3.2.2 | Perfil PAM: faillock_notify (pré-verificação e reset)"
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/faillock_notify
    owner: root
    group: root
    mode: "0644"
    content: |
      Name: Notify of failed login attempts and reset count upon success
      Default: yes
      Priority: 1024
      Auth-Type: Primary
      Auth:
          requisite pam_faillock.so preauth
      Account-Type: Primary
      Account:
          required pam_faillock.so

- name: "5.3.2.2 | Verificar se o faillock já está ativo no PAM"
  ansible.builtin.command: grep -q pam_faillock /etc/pam.d/common-auth
  register: faillock_check
  changed_when: false
  failed_when: false

- name: "5.3.2.2 | Ativar os perfis faillock no PAM"
  ansible.builtin.command: pam-auth-update --enable faillock faillock_notify
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: faillock_check.rc != 0

# ---------- Validade das passwords e contas ----------
- name: "5.4.1.x / 5.4.3.3 | Políticas em /etc/login.defs"
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^\s*#?\s*PASS_MAX_DAYS\s',  line: "PASS_MAX_DAYS\t365",       cis: "5.4.1.1" }
    - { regexp: '^\s*#?\s*PASS_MIN_DAYS\s',  line: "PASS_MIN_DAYS\t1",         cis: "5.4.1.2" }
    - { regexp: '^\s*#?\s*PASS_WARN_AGE\s',  line: "PASS_WARN_AGE\t7",         cis: "5.4.1.3" }
    - { regexp: '^\s*#?\s*ENCRYPT_METHOD\s', line: "ENCRYPT_METHOD YESCRYPT", cis: "5.4.1.4" }
    - { regexp: '^\s*#?\s*UMASK\s',          line: "UMASK\t\t027",              cis: "5.4.3.3" }
  loop_control:
    label: "{{ item.cis }} {{ item.line }}"

- name: "5.4.1.5 | Bloquear contas 45 dias após a password expirar"
  ansible.builtin.lineinfile:
    path: /etc/default/useradd
    regexp: '^\s*#?\s*INACTIVE='
    line: "INACTIVE=45"

- name: "5.4.1.1-5.4.1.3 | Aplicar validade aos utilizadores existentes"
  ansible.builtin.user:
    name: "{{ item }}"
    password_expire_max: 365
    password_expire_min: 1
    password_expire_warn: 7
  loop: "{{ cis_ssh_allowed_users }}"

- name: "5.4.3.2 | Terminar sessões inativas após 15 minutos"
  ansible.builtin.copy:
    dest: /etc/profile.d/60-cis-tmout.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # CIS 5.4.3.2 - gerido por Ansible
      TMOUT=900
      readonly TMOUT
      export TMOUT

- name: "5.4.3.3 | Umask restritiva por omissão"
  ansible.builtin.copy:
    dest: /etc/profile.d/60-cis-umask.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # CIS 5.4.3.3 - gerido por Ansible
      umask 027
