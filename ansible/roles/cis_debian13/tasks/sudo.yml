---
- name: "5.2.2 / 5.2.3 / 5.2.6 | Política sudo (validada com visudo antes de gravar)"
  ansible.builtin.copy:
    dest: /etc/sudoers.d/60-cis
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # CIS Debian 13 v1.0.0 - gerido por Ansible
      # 5.2.2
      Defaults use_pty
      # 5.2.3
      Defaults logfile="/var/log/sudo.log"
      # 5.2.6
      Defaults timestamp_timeout=15

- name: "5.2.7 | Grupo vazio para restringir o comando su"
  ansible.builtin.group:
    name: sugroup
    state: present

- name: "5.2.7 | Só o grupo sugroup pode usar su"
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^auth\s+required\s+pam_wheel\.so'
    line: "auth       required   pam_wheel.so use_uid group=sugroup"
    insertafter: '^auth\s+sufficient\s+pam_rootok\.so'

- name: "5.2.4 | SALVAGUARDA: ler membros do grupo sudo"
  ansible.builtin.getent:
    database: group
    key: sudo

- name: "5.2.4 | SALVAGUARDA: confirmar que o admin pertence ao grupo sudo"
  ansible.builtin.assert:
    that:
      - cis_sudo_admin_user in ansible_facts.getent_group['sudo'][2].split(',')
    fail_msg: "ABORTADO: {{ cis_sudo_admin_user }} não está no grupo sudo. Remover o NOPASSWD deixaria o sistema sem administrador."
    success_msg: "OK: {{ cis_sudo_admin_user }} pertence ao grupo sudo."

- name: "5.2.4 | Remover sudo sem password (criado na instalação automática)"
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ cis_sudo_admin_user }}"
    state: absent

- name: "5.2.4 / 5.2.5 | VERIFICAÇÃO: não pode restar NOPASSWD nem !authenticate"
  ansible.builtin.command: grep -rEn 'NOPASSWD|!authenticate' /etc/sudoers /etc/sudoers.d
  register: nopasswd_check
  changed_when: false
  failed_when: nopasswd_check.rc == 0
