---
# Ordem intencional: o que pode bloquear o acesso vem no fim; AIDE em último.

- name: Bloco 1.1.1 / 3.2 - Módulos de kernel
  ansible.builtin.import_tasks: kernel_modules.yml
  when: cis_kernel_modules
  tags: [kernel_modules, section1, section3]

- name: Bloco 1.5 / 3.3 - Parâmetros de kernel e core dumps
  ansible.builtin.import_tasks: sysctl.yml
  when: cis_sysctl
  tags: [sysctl, section1, section3]

- name: Bloco 1.6 - Banners
  ansible.builtin.import_tasks: banners.yml
  when: cis_banners
  tags: [banners, section1]

- name: Bloco 2.x - Serviços, cron e at
  ansible.builtin.import_tasks: services.yml
  when: cis_services
  tags: [services, section2]

- name: Bloco 1.1.2.2 - /dev/shm
  ansible.builtin.import_tasks: mounts.yml
  when: cis_mounts
  tags: [mounts, section1]

- name: Bloco 1.3 / 1.4 - AppArmor e arranque
  ansible.builtin.import_tasks: apparmor_grub.yml
  when: cis_apparmor_grub
  tags: [apparmor, grub, section1]

- name: Bloco 6.1.1 - journald
  ansible.builtin.import_tasks: journald.yml
  when: cis_journald
  tags: [journald, section6]

- name: Bloco 6.2 - Auditoria
  ansible.builtin.import_tasks: auditd.yml
  when: cis_auditd
  tags: [auditd, section6]

- name: Bloco 4.1 - Firewall
  ansible.builtin.import_tasks: firewall.yml
  when: cis_firewall
  tags: [firewall, section4]

- name: Bloco 5.1 - SSH
  ansible.builtin.import_tasks: ssh.yml
  when: cis_ssh
  tags: [ssh, section5]

- name: Bloco 5.3 / 5.4 / 7.1 - Passwords, contas e ficheiros
  ansible.builtin.import_tasks: passwords.yml
  when: cis_passwords
  tags: [passwords, section5]

- name: Bloco 5.2 - sudo e su
  ansible.builtin.import_tasks: sudo.yml
  when: cis_sudo
  tags: [sudo, section5]

- name: Bloco 6.3 - Integridade (AIDE) - sempre em último
  ansible.builtin.import_tasks: aide.yml
  when: cis_aide
  tags: [aide, section6]
