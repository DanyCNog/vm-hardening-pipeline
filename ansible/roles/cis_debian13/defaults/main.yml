---
# ============================================================
# Role cis_debian13 - CIS Debian Linux 13 Benchmark v1.0.0
# Level 1 Server (subconjunto). IDs CIS indicados em cada item.
# ============================================================

# Interruptores por bloco
cis_kernel_modules: true
cis_sysctl: true
cis_banners: true

# 1.1.1.x e 3.2.x - Módulos de kernel a desativar
cis_disabled_modules:
  - { name: cramfs,        cis: "1.1.1.1" }
  - { name: freevxfs,      cis: "1.1.1.2" }
  - { name: hfs,           cis: "1.1.1.3" }
  - { name: hfsplus,       cis: "1.1.1.4" }
  - { name: jffs2,         cis: "1.1.1.5" }
  - { name: firewire_core, cis: "1.1.1.9" }
  - { name: usb_storage,   cis: "1.1.1.10" }
  - { name: atm,           cis: "3.2.1" }
  - { name: can,           cis: "3.2.2" }
  - { name: dccp,          cis: "3.2.3" }
  - { name: rds,           cis: "3.2.4" }
  - { name: sctp,          cis: "3.2.5" }
  - { name: tipc,          cis: "3.2.6" }

# 1.5.x e 3.3.x - Parâmetros de kernel
cis_sysctl_file: /etc/sysctl.d/60-cis-hardening.conf
cis_sysctl_settings:
  # 1.5 - Kernel e processos
  - { key: fs.protected_hardlinks,    value: "1", cis: "1.5.1" }
  - { key: fs.protected_symlinks,     value: "1", cis: "1.5.2" }
  - { key: kernel.yama.ptrace_scope,  value: "1", cis: "1.5.3/1.5.10" }
  - { key: fs.suid_dumpable,          value: "0", cis: "1.5.4" }
  - { key: kernel.dmesg_restrict,     value: "1", cis: "1.5.5" }
  - { key: kernel.kptr_restrict,      value: "1", cis: "1.5.8" }
  - { key: kernel.randomize_va_space, value: "2", cis: "1.5.9" }
  # 3.3.1 - IPv4
  - { key: net.ipv4.ip_forward,                        value: "0", cis: "3.3.1.1" }
  - { key: net.ipv4.conf.all.forwarding,               value: "0", cis: "3.3.1.2" }
  - { key: net.ipv4.conf.default.forwarding,           value: "0", cis: "3.3.1.3" }
  - { key: net.ipv4.conf.all.send_redirects,           value: "0", cis: "3.3.1.4" }
  - { key: net.ipv4.conf.default.send_redirects,       value: "0", cis: "3.3.1.5" }
  - { key: net.ipv4.icmp_ignore_bogus_error_responses, value: "1", cis: "3.3.1.6" }
  - { key: net.ipv4.icmp_echo_ignore_broadcasts,       value: "1", cis: "3.3.1.7" }
  - { key: net.ipv4.conf.all.accept_redirects,         value: "0", cis: "3.3.1.8" }
  - { key: net.ipv4.conf.default.accept_redirects,     value: "0", cis: "3.3.1.9" }
  - { key: net.ipv4.conf.all.secure_redirects,         value: "0", cis: "3.3.1.10" }
  - { key: net.ipv4.conf.default.secure_redirects,     value: "0", cis: "3.3.1.11" }
  - { key: net.ipv4.conf.all.rp_filter,                value: "1", cis: "3.3.1.12" }
  - { key: net.ipv4.conf.default.rp_filter,            value: "1", cis: "3.3.1.13" }
  - { key: net.ipv4.conf.all.accept_source_route,      value: "0", cis: "3.3.1.14" }
  - { key: net.ipv4.conf.default.accept_source_route,  value: "0", cis: "3.3.1.15" }
  - { key: net.ipv4.conf.all.log_martians,             value: "1", cis: "3.3.1.16" }
  - { key: net.ipv4.conf.default.log_martians,         value: "1", cis: "3.3.1.17" }
  - { key: net.ipv4.tcp_syncookies,                    value: "1", cis: "3.3.1.18" }
  # 3.3.2 - IPv6
  - { key: net.ipv6.conf.all.forwarding,               value: "0", cis: "3.3.2.1" }
  - { key: net.ipv6.conf.default.forwarding,           value: "0", cis: "3.3.2.2" }
  - { key: net.ipv6.conf.all.accept_redirects,         value: "0", cis: "3.3.2.3" }
  - { key: net.ipv6.conf.default.accept_redirects,     value: "0", cis: "3.3.2.4" }
  - { key: net.ipv6.conf.all.accept_source_route,      value: "0", cis: "3.3.2.5" }
  - { key: net.ipv6.conf.default.accept_source_route,  value: "0", cis: "3.3.2.6" }
  - { key: net.ipv6.conf.all.accept_ra,                value: "0", cis: "3.3.2.7" }
  - { key: net.ipv6.conf.default.accept_ra,            value: "0", cis: "3.3.2.8" }

# 1.6.x - Texto dos banners (sem versão do SO, conforme CIS)
cis_banner_text: |
  Authorized access only. All activity on this system may be monitored and reported.
